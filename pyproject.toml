[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.31.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
norecursedirs = [".venv", ".tmp", "operator", "pytest-cache-files-*"]

[tool.setuptools.packages.find]
include = ["app*"]

# APScheduler 3.x has no py.typed marker or published stubs. Keep this exception
# limited to that dependency; application type errors remain blocking.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node.js 24
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry install --no-root --no-interaction
      - name: Lint
        run: poetry run flake8 -j 1 app tests scripts/check_secrets.py
      - name: Type check
        run: poetry run mypy app
      - name: Tests
        run: poetry run pytest

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node.js 24
        with:
          python-version: "3.11"
      - name: Scan tracked files and reachable history (redacted)
        run: python scripts/check_secrets.py --history

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
      - name: Build application image
        run: docker build -t travelltickets:ci .
      - name: Verify startup and HTTP routes without production credentials
        run: |
          docker run -d --name travelltickets-ci -p 127.0.0.1:5000:5000 \
            -e PYTHON_DOTENV_DISABLED=1 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e TELEGRAM_BOT_TOKEN= \
            -e TRAVELPAYOUTS_TOKEN= \
            travelltickets:ci
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:5000/healthz
          curl --fail http://127.0.0.1:5000/ > /dev/null
          curl --fail http://127.0.0.1:5000/login > /dev/null
          curl --silent --output /dev/null 'http://127.0.0.1:5000/tg/monitorings?token=ci-probe-secret'
          if docker logs travelltickets-ci 2>&1 | grep -F 'ci-probe-secret'; then
            echo 'Access log leaked the synthetic query token'
            exit 1
          fi
      - name: Validate legacy HAProxy config with disposable TLS material
        run: |
          cert_dir="$RUNNER_TEMP/travelltickets-ci-certs"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$cert_dir/key.pem" -out "$cert_dir/cert.pem" 2>/dev/null
          python -c 'from pathlib import Path; import sys; p = Path(sys.argv[1]); (p / "www.travelltickets.ru.pem").write_bytes((p / "cert.pem").read_bytes() + (p / "key.pem").read_bytes())' "$cert_dir"
          docker run --rm --add-host app:127.0.0.1 \
            -v "$PWD/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v "$cert_dir:/usr/local/etc/haproxy/certs:ro" \
            haproxy:2.9-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs travelltickets-ci || true
          docker rm -f travelltickets-ci || true

  postgres-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      POSTGRES_REHEARSAL: "1"
      POSTGRES_USER: travelltickets_ci
      POSTGRES_PASSWORD: disposable-ci-password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelltickets_ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: travelltickets_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelltickets_ci -d travelltickets_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node.js 24
        with:
          python-version: "3.11"
      - name: Install locked application dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry install --only main --no-root --no-interaction
      - name: Seed disposable database and create native backup
        run: |
          echo "DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/travelltickets_ci" >> "$GITHUB_ENV"
          DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/travelltickets_ci" \
            poetry run python -m scripts.postgres_rehearsal seed
          db_container="${{ job.services.postgres.id }}"
          docker exec "$db_container" pg_dump -U "$POSTGRES_USER" \
            --format=custom --no-owner --no-acl --file=/tmp/travelltickets.dump travelltickets_ci
          docker exec "$db_container" pg_restore --list /tmp/travelltickets.dump > /dev/null
      - name: Restore into a separate database and verify application startup/data
        run: |
          db_container="${{ job.services.postgres.id }}"
          docker exec "$db_container" createdb -U "$POSTGRES_USER" travelltickets_restore_ci
          docker exec "$db_container" pg_restore -U "$POSTGRES_USER" \
            --exit-on-error --no-owner --no-acl \
            --dbname=travelltickets_restore_ci /tmp/travelltickets.dump
          DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/travelltickets_restore_ci" \
            poetry run python -m scripts.postgres_rehearsal verify

global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend http_in
    bind *:80
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    default_backend app_backend

backend app_backend
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server app app:5000 check

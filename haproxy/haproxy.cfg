global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    # Keep method/path/status/timings, never query strings or captured cookies.
    log-format "%ci:%cp [%t] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %ts %HM %HP"
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 5s

frontend http_in
    bind *:80
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/www.travelltickets.ru.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=()"
    default_backend app_backend

backend app_backend
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server app app:5000 check inter 5s fall 3 rise 2

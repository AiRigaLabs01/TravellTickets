<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravellTickets — вход</title>
<style>
:root { --primary:#1a73e8; --primary-dark:#1557b0; --border:#e0e4ef; --text:#1a1d23; --muted:#6b7280; --danger:#d93025; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg,#f4f6fb 0%,#e8f0fe 100%); color: var(--text); }
.auth-shell { width: 100%; max-width: 420px; padding: 24px; }
.auth-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 42px rgba(26,29,35,.14); padding: 28px; }
.auth-brand { color: var(--primary); font-weight: 800; font-size: 15px; margin-bottom: 6px; }
h1 { font-size: 22px; margin: 0 0 20px; }
.alert-error { background:#fce8e6; border:1px solid #f28b82; color:#b31412; border-radius:10px; padding:11px 15px; margin-bottom:14px; font-size:13px; }
.form-group { display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
input { width:100%; min-height:42px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; }
input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,115,232,.12); }
button { width:100%; min-height:42px; border:0; border-radius:10px; background:var(--primary); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
button:hover { background:var(--primary-dark); }
</style>
</head>
<body class="auth-page">
<main class="auth-shell">
  <form class="auth-card" method="post" action="/login">
    <div class="auth-brand">TravellTickets</div>
    <h1>Вход администратора</h1>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <div class="form-group">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary auth-submit" type="submit">Войти</button>
  </form>
</main>
</body>
</html>
